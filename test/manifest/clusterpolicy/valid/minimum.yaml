apiVersion: spyre.ibm.com/v1alpha1
kind: SpyreClusterPolicy
metadata:
  name: spyreclusterpolicy-minimum
spec:
  devicePlugin:
    repository: "docker.io/spyre-operator"
    image: "spyre-device-plugin"
    version: "dev"
  metricsExporter:
    enabled: false
  podValidator:
    enabled: false
  scheduler: {}
