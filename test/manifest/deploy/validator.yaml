apiVersion: apps/v1
kind: Deployment
metadata:
  name: spyre-webhook-validator
  namespace: spyre-operator
  labels:
    app: spyre-webhook-validator
    app.kubernetes.io/part-of: spyre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spyre-webhook-validator
  template:
    metadata:
      labels:
        app: spyre-webhook-validator
    spec:
      containers:
      - name: spyre-webhook-validator
        image: docker.io/spyre-operator/spyre-webhook-validator:1.3.0-dev
        imagePullPolicy: Always
        env:
        - name: SCHEDULER_ENABLED
          value: "true"
        - name: LOGLEVEL
          value: "debug"
        ports:
        - containerPort: 8443
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: certs
          mountPath: /etc/webhook/certs
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 64Mi
      volumes:
      - name: certs
        secret:
          secretName: spyre-validator-webhook-secret
