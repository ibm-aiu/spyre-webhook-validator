#
# ResourceClaim requesting the spyre-standard-vf DeviceClass in spyre-apps.
# Expected: ALLOWED under VF mode ON, DENIED under VF mode OFF.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: test-claim-standard-vf
  namespace: spyre-apps
spec:
  devices:
    requests:
    - name: req0
      exactly:
        deviceClassName: spyre-standard-vf
