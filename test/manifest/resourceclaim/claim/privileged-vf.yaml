#
# ResourceClaim requesting the spyre-privileged-vf DeviceClass in spyre-apps.
# Expected: DENIED under both VF mode ON and VF mode OFF.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: test-claim-privileged-vf
  namespace: spyre-apps
spec:
  devices:
    requests:
    - name: req0
      exactly:
        deviceClassName: spyre-privileged-vf
