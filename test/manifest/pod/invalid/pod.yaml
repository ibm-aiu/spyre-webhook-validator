apiVersion: v1
kind: Pod
metadata:
  name: invalid-pod
  namespace: default
spec:
  containers:
  - name: app
    image: registry.access.redhat.com/ubi9/ubi:latest
    imagePullPolicy: IfNotPresent
    command: ["tail", "-f", "/dev/null"]
    resources:
      limits:
        ibm.com/spyre_pf_0000_1a_00.0: "1"
        ibm.com/spyre_pf_0000_3d_00.0: "1"
  terminationGracePeriodSeconds: 0
