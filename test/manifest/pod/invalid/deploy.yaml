apiVersion: apps/v1
kind: Deployment
metadata:
  name: invalid-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployment-app
  template:
    metadata:
      labels:
        app: deployment-app
    spec:
      containers:
      - name: app
        image: registry.access.redhat.com/ubi9/ubi:latest
        imagePullPolicy: IfNotPresent
        command: ["tail", "-f", "/dev/null"]
        resources:
          limits:
            ibm.com/spyre_pf_0000_1a_00.0: "1"
            ibm.com/spyre_pf_0000_3d_00.0: "1"
